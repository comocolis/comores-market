name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    
    # Build de l'application
    - name: Build
      run: npm run build
      env:
        NODE_ENV: production
        # Ajoutez ici vos variables d'environnement nécessaires au build si besoin
        # NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        # NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    # Ajout d'une étape pour lister le contenu afin de vérifier si le build a bien généré le dossier .next
    - name: List files
      run: ls -R .next || echo ".next directory not found"

    - name: Run Playwright tests
      run: npx playwright test
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30